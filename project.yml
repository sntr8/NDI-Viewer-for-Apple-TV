name: NDIViewerTV
options:
  bundleIdPrefix: com.sntr
  deploymentTarget:
    tvOS: "17.0"

targets:
  NDIViewerTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources/NDIViewerTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sntr.ndiviewertv
        SWIFT_OBJC_BRIDGING_HEADER: Sources/NDIViewerTV/Bridging/NDIViewerTV-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(PROJECT_DIR)/Vendor/NDI/include"]
        TVOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        DEVELOPMENT_TEAM: SUAR78K288
        CODE_SIGN_STYLE: Automatic
        # The NDI tvOS library is a C++ static lib, so the C++ runtime has to be
        # linked explicitly — Swift-only targets don't pull it in on their own.
        OTHER_LDFLAGS: ["-lc++"]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "NDI Viewer"
        NSBonjourServices:
          - _ndi._tcp.
        NSLocalNetworkUsageDescription: "NDI Viewer discovers and receives NDI video sources on your local network."
    dependencies:
      # Built locally from the NDI SDK's lib/tvOS/libndi_tvos.a — see
      # Vendor/NDI/README.md. It's a *static* library xcframework, so it is
      # linked, never embedded.
      - framework: Vendor/NDI/libndi_tvos.xcframework
        embed: false
      # libndi_tvos.a calls into both of these directly (H.264 encode/decode
      # and the vImage colour conversions), and a static lib pulls in no
      # dependencies of its own.
      - sdk: VideoToolbox.framework
      - sdk: Accelerate.framework
